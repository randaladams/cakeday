name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk cakeday.apk

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cakeday-apk
          path: cakeday.apk

      # Publishes to a fixed release so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/cakeday.apk
      - name: Publish to "latest-build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build cakeday.apk --clobber
            gh release edit latest-build --notes "$NOTES"
          else
            gh release create latest-build cakeday.apk --title "Latest build" --notes "$NOTES"
          fi
